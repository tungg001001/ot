    const Award = (p) => <IconWrapper {...p}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></IconWrapper>;
    const Check = (p) => <IconWrapper {...p}><polyline points="20 6 9 17 4 12" /></IconWrapper>;
    const Copy = (p) => <IconWrapper {...p}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></IconWrapper>;

    // --- DATA ---
    const CATEGORIES = [
      { id: 'all', name: '全部分類', Icon: Activity },
      { id: 'adult', name: '成人生理職能治療', Icon: HeartPulse },
      { id: 'peds', name: '兒童與早期療育', Icon: Baby },
      { id: 'psy', name: '心理職能治療', Icon: Brain },
      { id: 'assistive', name: '輔具與人因工程', Icon: Sliders },
      { id: 'soap', name: '病歷寫作句型', Icon: FileText },
    ];

    const PHRASES = [
      {
        id: 'p1',
        category: 'adult',
        english: "The patient demonstrates decreased active range of motion (AROM) in the right shoulder due to spasticity and hypertonicity.",
        chinese: "患者因痙攣與肌張力過高，導致右肩主動關節活動度 (AROM) 降低。",
        keywords: ["AROM", "hypertonicity", "spasticity"],
        context: "中風或腦傷上肢評估紀錄，描述關節活動受限主因。"
      },
      {
        id: 'p2',
        category: 'adult',
        english: "Client requires minimal assistance (Min A) of 1 for standing balance during upper extremity dressing.",
        chinese: "個案在上肢穿衣過程中需要單人輕度協助 (Min A) 以維持站立平衡。",
        keywords: ["Min A", "standing balance", "UE dressing"],
        context: "評估日常穿衣獨立度與站立平衡表現。"
      },
      {
        id: 'p3',
        category: 'adult',
        english: "Prior to discharge, the client achieved full independence in basic ADLs utilizing energy conservation techniques.",
        chinese: "出院前，個案運用省力策略 (Energy Conservation) 達成了基本日常生活活動 (ADLs) 的完全獨立。",
        keywords: ["discharge", "ADLs", "energy conservation"],
        context: "心肺復健或慢性病出院準備評估報告寫作。"
      },
      {
        id: 'p4',
        category: 'adult',
        english: "Instructed client in proper dynamic tub-bench transfer techniques to prevent weight-bearing violations on the affected hip.",
        chinese: "指導個案正確的動態浴缸轉位椅轉位技巧，以避免患側髖關節過度承重違反醫囑限制。",
        keywords: ["tub-bench transfer", "weight-bearing", "affected hip"],
        context: "髖關節置換術 (THA) 後轉位指導術語。"
      },
      {
        id: 'p5',
        category: 'peds',
        english: "Child exhibits tactile defensiveness when exposed to textured art materials and requires heavy proprioceptive input to self-regulate.",
        chinese: "兒童在接觸不同材質的美勞材料時展現觸覺防禦，且需要高強度的本體覺輸入來自我調節。",
        keywords: ["tactile defensiveness", "proprioceptive input", "self-regulate"],
        context: "感覺統合 (SI) 評估與介入紀錄專用表達。"
      },
      {
        id: 'p6',
        category: 'peds',
        english: "The intervention plan focuses on improving fine motor precision and dynamic tripod grasp for functional handwriting.",
        chinese: "介入計畫著重於提升精細動作精準度與動態三指握姿，以增進功能性握筆書寫能力。",
        keywords: ["fine motor precision", "dynamic tripod grasp", "handwriting"],
        context: "學齡前兒童握筆發展遲緩評估與目標設定。"
      },
      {
        id: 'p7',
        category: 'psy',
        english: "Client reports elevated cognitive fatigue during stress and successfully applies grounding techniques to enhance occupational focus.",
        chinese: "個案主訴壓力下認知疲勞增加，並能成功運用著陸技巧 (Grounding) 來增進職能活動專注力。",
        keywords: ["cognitive fatigue", "grounding techniques", "occupational focus"],
        context: "心理衛生職能治療或創傷後壓力症候群個案衛教紀錄。"
      },
      {
        id: 'p8',
        category: 'assistive',
        english: "Custom thermoplastic resting hand splint was fabricated to maintain functional hand positioning and prevent wrist flexion contractures.",
        chinese: "製作客製化熱塑性靜止型手副木，以維持功能性手部姿勢並預防手腕屈曲攣縮。",
        keywords: ["resting hand splint", "thermoplastic", "flexion contractures"],
        context: "副木評估與製作報告描繪。"
      },
      {
        id: 'p9',
        category: 'soap',
        english: "S: Client states, 'I cannot button my shirt without my fingers feeling numb and weak.'",
        chinese: "S (主觀描述): 個案表示「我扣襯衫鈕扣時手指感到麻木無力。」",
        keywords: ["S (Subjective)", "numbness", "button shirt"],
        context: "SOAP 病歷紀錄之個案主訴傳達法。"
      },
      {
        id: 'p10',
        category: 'soap',
        english: "O: Client performed 15 minutes of upper extremity pegboard training requiring Moderate Assistance (Mod A) for fine motor placement.",
        chinese: "O (客觀紀錄): 個案進行 15 分鐘上肢插棒盤訓練，在精細動作放置上需要中度協助 (Mod A)。",
        keywords: ["O (Objective)", "Mod A", "pegboard"],
        context: "SOAP 病歷客觀紀錄可量化治療介入項目與協助等級。"
      }
    ];

    const ARTICLES = [
      {
        id: 'art1',
        title: "Post-Stroke Upper Extremity CIMT & ADL Retraining",
        subtitle: "腦中風後上肢強制誘發運動治療與日常生活活動再訓練案例",
        category: "adult",
        readTime: "6 min",
        difficulty: "Advanced",
        paragraphs: [
          {
            id: 1,
            en: "Stroke remains a major cause of adult motor disability worldwide. Post-stroke hemiparesis severely impairs upper extremity (UE) function, creating profound occupational performance deficits in Instrumental Activities of Daily Living (IADLs) such as meal preparation, laundry, and financial management.",
            zh: "腦中風仍是全球成人運動失能的主要原因。中風後的偏癱嚴重損害了上肢 (UE) 功能，造成工具性日常生活活動 (IADLs) 如備餐、洗衣服和理財等職能表現的嚴重障礙。",
            vocab: [
              { word: "hemiparesis", definition: "偏癱 / 輕癱", phonetic: "/ˌhem.i.pəˈriː.sɪs/" },
              { word: "IADLs", definition: "工具性日常生活活動 (Instrumental Activities of Daily Living)", phonetic: "I-A-D-Ls" }
            ]
          },
          {
            id: 2,
            en: "Constraint-Induced Movement Therapy (CIMT) is a high-evidence neurological intervention designed to counteract 'learned non-use'. By placing a protective constraint mitt on the non-affected limb for up to 90% of waking hours, the therapist forces high-intensity, task-oriented shaping of the paretic upper extremity.",
            zh: "強制誘發運動治療 (CIMT) 是一種具備高實證等級的神經復健介入法，旨在對抗『習得廢用』。透過在清醒時間高達 90% 的時間內將防護手套配戴於健側肢體，治療師能強制患者以輕癱側上肢進行高強度、任務導向的塑造練習 (Shaping)。",
            vocab: [
              { word: "learned non-use", definition: "習得廢用 (因習慣依賴健側而致患側功能退化)", phonetic: "/lɜːnd nɒn juːs/" },
              { word: "shaping", definition: "塑造技巧 (逐步增加任務難度的行為改變技術)", phonetic: "/ˈʃeɪ.pɪŋ/" }
            ]
          }
        ],
        quiz: [
          {
            id: 'q1',
            question: "What core clinical phenomenon does CIMT specifically target and aim to overcome?",
            options: [
              "Hypoactive stretch reflexes",
              "Learned non-use of the affected extremity",
              "Cognitive agnosia",
              "Sensory aphasia"
            ],
            correct: 1,
            rationale: "CIMT focuses on forcing the patient to use the paretic arm, overcoming the habit of relying solely on the healthy arm ('learned non-use')."
          }
        ]
      }
    ];

    const GLOSSARY = [
      { term: "AROM", fullText: "Active Range of Motion", category: "Biomechanical", definition: "主動關節活動度：肌肉在無外力協助下主動收縮所能帶動的最大關節角度。" },
      { term: "PROM", fullText: "Passive Range of Motion", category: "Biomechanical", definition: "被動關節活動度：外力完全施加下所能達到的最大關節活動角度。" },
      { term: "MMT", fullText: "Manual Muscle Testing", category: "Biomechanical", definition: "徒手肌力檢查：將肌力分為 0 (Zero) 到 5 (Normal) 分之標準臨床測試。" },
      { term: "MAS", fullText: "Modified Ashworth Scale", category: "Neurological", definition: "改良式艾希沃斯量表：評估肌肉中風或腦傷後痙攣張力 (Spasticity) 之臨床金標準。" },
      { term: "OTPF-4", fullText: "Occupational Therapy Practice Framework 4th Ed.", category: "Framework", definition: "美國職能治療學會第 4 版實踐框架：明確劃分 Domain (領域) 與 Process (過程)。" },
      { term: "ADL", fullText: "Activities of Daily Living", category: "Domain", definition: "基本日常生活活動：如進食、穿衣、沐浴、個人衛生、個人轉位、上廁所。" }
    ];

    const SOAP_BUILDER_DATA = {
      S: {
        title: "Subjective (S) - 主觀描述",
        options: [
          { text: "Client states, 'I get sharp pain in my shoulder when reaching overhead for groceries.'", translation: "個案表示『高舉手臂拿雜物時肩部會劇痛。』" },
          { text: "Client denies pain today but expresses frustration about needing help for toilet transfers.", translation: "個案否定今日疼痛，但對上廁所轉位需要協助感到挫折。" }
        ]
      },
      O: {
        title: "Objective (O) - 客觀數據",
        options: [
          { text: "Client completed 20 minutes of dynamic balance training and required Moderate Assistance (Mod A) for tub bench transfers.", translation: "個案完成20分鐘動態平衡訓練，在浴缸轉位椅轉位時需中度協助 (Mod A)。" },
          { text: "Patient demonstrated right grip strength of 15 lbs with a dynamometer.", translation: "患者以握力器測得右手握力為 15 磅。" }
        ]
      },
      A: {
        title: "Assessment (A) - 臨床推論",
        options: [
          { text: "Client's decreased fine motor precision and 3/5 grip strength limit independent buttoning during dressing tasks.", translation: "個案的精細動作精準度降低與 3/5 肌力限制了其在穿衣任務中獨立扣鈕扣的能力。" }
        ]
      },
      P: {
        title: "Plan (P) - 未來治療計畫",
        options: [
          { text: "Continue skilled OT 45 mins/session, 3x/week for 3 weeks focusing on adaptive tool use and home safety hazard modification.", translation: "繼續進行專業 OT 每次45分鐘、每週3次共3週，著重於適應性工具使用與居家安全改善。" }
        ]
      }
    };

    // --- MAIN REACT COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('phrases');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [speechRate, setSpeechRate] = useState(0.9);

      const [bookmarkedIds, setBookmarkedIds] = useState(['p1']);
      const [masteredIds, setMasteredIds] = useState([]);

      const [showChineseArticle, setShowChineseArticle] = useState(true);
      const [activeVocabModal, setActiveVocabModal] = useState(null);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizSubmitted, setQuizSubmitted] = useState(false);

      const [soapSelections, setSoapSelections] = useState({ S: 0, O: 0, A: 0, P: 0 });
      const [copiedSoap, setCopiedSoap] = useState(false);

      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = speechRate;
          window.speechSynthesis.speak(utterance);
        }
      };

      const toggleBookmark = (id) => {
        setBookmarkedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const toggleMastered = (id) => {
        setMasteredIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const filteredPhrases = useMemo(() => {
        return PHRASES.filter(p => {
          const matchCat = selectedCategory === 'all' || p.category === selectedCategory;
          const matchSearch = p.english.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              p.chinese.includes(searchTerm);
          return matchCat && matchSearch;
        });
      }, [selectedCategory, searchTerm]);

      const builtSoapText = useMemo(() => {
        const s = SOAP_BUILDER_DATA.S.options[soapSelections.S]?.text || '';
        const o = SOAP_BUILDER_DATA.O.options[soapSelections.O]?.text || '';
        const a = SOAP_BUILDER_DATA.A.options[soapSelections.A]?.text || '';
        const p = SOAP_BUILDER_DATA.P.options[soapSelections.P]?.text || '';
        return `S: ${s}\n\nO: ${o}\n\nA: ${a}\n\nP: ${p}`;
      }, [soapSelections]);

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        setCopiedSoap(true);
        setTimeout(() => setCopiedSoap(false), 2000);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40 border-b border-teal-500/30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row items-center justify-between gap-3">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('phrases')}>
                <div className="bg-gradient-to-tr from-teal-500 to-emerald-400 p-2.5 rounded-xl text-slate-950 font-bold flex items-center justify-center">
                  <HeartPulse className="w-6 h-6 text-slate-950" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-lg font-bold text-white">OT Medical English Hub</h1>
                    <span className="text-[10px] bg-teal-500/20 text-teal-300 border border-teal-500/40 px-2 py-0.5 rounded-full font-medium">
                      職能治療英文
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Clinical Terminology & SOAP Sandbox</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center gap-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 overflow-x-auto max-w-full">
                {[
                  { id: 'phrases', name: '臨床短句庫', Icon: Activity },
                  { id: 'reading', name: '案例閱讀', Icon: BookOpen },
                  { id: 'soap', name: 'SOAP組裝', Icon: FileText },
                  { id: 'glossary', name: 'OT辭典', Icon: GraduationCap },
                  { id: 'flashcards', name: '字卡複習', Icon: Layers },
                  { id: 'bookmarks', name: '收藏夾', Icon: Bookmark, badge: bookmarkedIds.length }
                ].map(tab => {
                  const TabIcon = tab.Icon;
                  const isActive = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                        isActive ? 'bg-teal-500 text-slate-950 shadow' : 'text-slate-300 hover:bg-slate-700/60'
                      }`}
                    >
                      <TabIcon className="w-3.5 h-3.5" />
                      <span>{tab.name}</span>
                      {tab.badge > 0 && (
                        <span className="ml-1 bg-amber-400 text-slate-950 text-[10px] font-bold px-1.5 py-0.2 rounded-full">
                          {tab.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>
            </div>
          </header>

          {/* TTS Bar */}
          <div className="bg-slate-100 border-b border-slate-200 py-1.5 px-4 text-xs text-slate-600 flex items-center justify-between">
            <div className="max-w-7xl mx-auto w-full flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <Volume2 className="w-4 h-4 text-teal-600" />
                <span className="font-semibold">語音速度 (TTS Rate):</span>
                {[0.8, 0.9, 1.0, 1.2].map(rate => (
                  <button
                    key={rate}
                    onClick={() => setSpeechRate(rate)}
                    className={`px-2 py-0.5 rounded font-mono text-[11px] ${
                      speechRate === rate ? 'bg-teal-600 text-white font-bold' : 'bg-white border border-slate-300'
                    }`}
                  >
                    {rate}x
                  </button>
                ))}
              </div>
              <div className="text-[11px] text-slate-500">
                掌握進度: <strong className="text-emerald-600">{masteredIds.length}</strong> / {PHRASES.length}
              </div>
            </div>
          </div>

          {/* Main View */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            
            {/* MODULE 1: CLINICAL PHRASES */}
            {activeTab === 'phrases' && (
              <div className="space-y-6">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none">
                    {CATEGORIES.map(cat => {
                      const CatIcon = cat.Icon;
                      const isSelected = selectedCategory === cat.id;
                      return (
                        <button
                          key={cat.id}
                          onClick={() => setSelectedCategory(cat.id)}
                          className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm whitespace-nowrap transition ${
                            isSelected ? 'bg-teal-700 text-white font-medium' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          <CatIcon className="w-3.5 h-3.5" />
                          <span>{cat.name}</span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="relative w-full md:w-72">
                    <Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input
                      type="text"
                      placeholder="搜尋短句或中文..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {filteredPhrases.map((item) => {
                    const isBookmarked = bookmarkedIds.includes(item.id);
                    const isMastered = masteredIds.includes(item.id);
                    return (
                      <div key={item.id} className={`bg-white p-5 rounded-2xl shadow-sm border transition flex flex-col justify-between ${isMastered ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200'}`}>
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-3">
                            <span className="text-[11px] font-semibold text-teal-800 bg-teal-50 px-2.5 py-1 rounded-md border border-teal-200">
                              {CATEGORIES.find(c => c.id === item.category)?.name || 'OT 臨床'}
                            </span>
                            <div className="flex items-center space-x-1">
                              <button onClick={() => toggleMastered(item.id)} className={`p-1.5 rounded-lg ${isMastered ? 'text-emerald-600 bg-emerald-100' : 'text-slate-300 hover:bg-slate-100'}`}>
                                <CheckCircle2 className="w-4 h-4" />
                              </button>
                              <button onClick={() => toggleBookmark(item.id)} className={`p-1.5 rounded-lg ${isBookmarked ? 'text-amber-500 bg-amber-50' : 'text-slate-300 hover:bg-slate-100'}`}>
                                <Bookmark className="w-4 h-4" fill={isBookmarked} />
                              </button>
                              <button onClick={() => speakText(item.english)} className="p-1.5 text-teal-600 hover:bg-teal-50 rounded-lg">
                                <Volume2 className="w-4 h-4" />
                              </button>
                            </div>
                          </div>

                          <p className="text-slate-900 font-semibold text-base leading-relaxed mb-2 font-serif">{item.english}</p>
                          <p className="text-slate-600 text-sm mb-4 leading-relaxed bg-slate-50 p-2.5 rounded-xl border border-slate-100">{item.chinese}</p>
                        </div>

                        <div className="mt-2 pt-3 border-t border-slate-100 flex items-start space-x-2 text-xs text-slate-500">
                          <Sparkles className="w-3.5 h-3.5 text-amber-500 flex-shrink-0 mt-0.5" />
                          <span><strong>臨床提示：</strong>{item.context}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* MODULE 2: CASE READINGS */}
            {activeTab === 'reading' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <div className="flex items-center justify-between border-b pb-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">{ARTICLES[0].title}</h2>
                    <p className="text-sm text-slate-500">{ARTICLES[0].subtitle}</p>
                  </div>
                  <button onClick={() => setShowChineseArticle(!showChineseArticle)} className="px-3 py-1.5 bg-slate-100 text-xs font-semibold rounded-xl border">
                    {showChineseArticle ? "隱藏中譯" : "顯示雙語"}
                  </button>
                </div>

                <div className="space-y-4">
                  {ARTICLES[0].paragraphs.map((p) => (
                    <div key={p.id} className="p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                      <div className="flex justify-between items-start">
                        <p className="text-slate-900 font-serif text-base leading-relaxed">{p.en}</p>
                        <button onClick={() => speakText(p.en)} className="text-slate-400 hover:text-teal-600 p-1">
                          <Volume2 className="w-4 h-4" />
                        </button>
                      </div>
                      {p.vocab && (
                        <div className="flex flex-wrap gap-2 pt-1">
                          {p.vocab.map((v, vIdx) => (
                            <button key={vIdx} onClick={() => setActiveVocabModal(v)} className="text-xs bg-teal-50 border border-teal-200 text-teal-800 px-2 py-0.5 rounded font-medium">
                              {v.word}
                            </button>
                          ))}
                        </div>
                      )}
                      {showChineseArticle && <p className="text-slate-600 text-sm pt-2 border-t border-slate-200/60">{p.zh}</p>}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* MODULE 3: SOAP BUILDER */}
            {activeTab === 'soap' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-md flex items-center space-x-3">
                  <FileText className="w-6 h-6 text-teal-300" />
                  <div>
                    <h2 className="text-lg font-bold">SOAP 病歷實戰組裝沙盒</h2>
                    <p className="text-xs text-slate-300">選擇不同章節的標準描述，即時生成可複製的英文病歷。</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="space-y-4">
                    {Object.keys(SOAP_BUILDER_DATA).map((secKey) => {
                      const sec = SOAP_BUILDER_DATA[secKey];
                      return (
                        <div key={secKey} className="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                          <h4 className="text-xs font-bold text-teal-800 bg-teal-50 px-2.5 py-1 rounded inline-block">{sec.title}</h4>
                          {sec.options.map((opt, oIdx) => (
                            <button
                              key={oIdx}
                              onClick={() => setSoapSelections(prev => ({ ...prev, [secKey]: oIdx }))}
                              className={`w-full text-left p-3 rounded-lg text-xs border transition ${
                                soapSelections[secKey] === oIdx ? 'bg-teal-50 text-teal-900 border-teal-500 font-medium' : 'bg-slate-50 text-slate-700'
                              }`}
                            >
                              <p className="font-mono">{opt.text}</p>
                              <p className="text-[11px] text-slate-500 mt-1">{opt.translation}</p>
                            </button>
                          ))}
                        </div>
                      );
                    })}
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between h-fit sticky top-20">
                    <div>
                      <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                        <h3 className="font-bold text-slate-900 text-sm">預覽與匯出病歷文字</h3>
                        <button onClick={() => copyToClipboard(builtSoapText)} className="flex items-center space-x-1 px-3 py-1 bg-teal-600 text-white text-xs font-bold rounded-lg">
                          <Copy className="w-3.5 h-3.5" />
                          <span>{copiedSoap ? "已複製！" : "複製全文"}</span>
                        </button>
                      </div>
                      <div className="mt-4 p-4 bg-slate-900 text-emerald-400 font-mono text-xs rounded-xl whitespace-pre-wrap leading-relaxed">
                        {builtSoapText}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MODULE 4: GLOSSARY */}
            {activeTab === 'glossary' && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {GLOSSARY.map((item, idx) => (
                    <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-lg font-extrabold text-teal-800 font-mono">{item.term}</span>
                          <span className="text-[10px] font-semibold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">{item.category}</span>
                        </div>
                        <p className="text-xs font-semibold text-slate-700 mb-2">{item.fullText}</p>
                        <p className="text-sm text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">{item.definition}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* MODULE 5: FLASHCARDS */}
            {activeTab === 'flashcards' && (
              <div className="max-w-xl mx-auto space-y-6">
                <div 
                  onClick={() => setIsFlipped(!isFlipped)}
                  className="bg-white min-h-[240px] p-8 rounded-3xl border-2 border-teal-200 shadow-lg cursor-pointer flex flex-col items-center justify-center text-center transition"
                >
                  {!isFlipped ? (
                    <div className="space-y-3">
                      <span className="text-xs font-bold bg-teal-50 text-teal-700 px-3 py-1 rounded-full">ENGLISH</span>
                      <p className="text-lg font-serif font-semibold text-slate-900">{PHRASES[cardIndex].english}</p>
                      <p className="text-xs text-slate-400">👆 點擊卡片翻面</p>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <span className="text-xs font-bold bg-amber-50 text-amber-700 px-3 py-1 rounded-full">CHINESE</span>
                      <p className="text-base font-medium text-slate-800">{PHRASES[cardIndex].chinese}</p>
                    </div>
                  )}
                </div>
                <div className="flex items-center justify-between">
                  <button onClick={() => { setIsFlipped(false); setCardIndex(prev => (prev > 0 ? prev - 1 : PHRASES.length - 1)); }} className="px-4 py-2 bg-slate-200 text-xs font-bold rounded-xl">上一張</button>
                  <button onClick={() => speakText(PHRASES[cardIndex].english)} className="p-3 bg-teal-600 text-white rounded-full"><Volume2 className="w-5 h-5" /></button>
                  <button onClick={() => { setIsFlipped(false); setCardIndex(prev => (prev < PHRASES.length - 1 ? prev + 1 : 0)); }} className="px-4 py-2 bg-teal-600 text-white text-xs font-bold rounded-xl">下一張</button>
                </div>
              </div>
            )}

            {/* MODULE 6: BOOKMARKS */}
            {activeTab === 'bookmarks' && (
              <div className="space-y-4 max-w-4xl mx-auto">
                <h3 className="text-base font-bold text-slate-900">我的收藏清單</h3>
                {PHRASES.filter(p => bookmarkedIds.includes(p.id)).map(item => (
                  <div key={item.id} className="bg-white p-4 rounded-xl border border-slate-200 flex items-start justify-between gap-4">
                    <div>
                      <p className="font-semibold text-slate-900 text-sm mb-1">{item.english}</p>
                      <p className="text-slate-600 text-xs">{item.chinese}</p>
                    </div>
                    <button onClick={() => toggleBookmark(item.id)} className="text-xs text-rose-500 font-medium">移除</button>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Vocab Modal */}
          {activeVocabModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4">
                <div className="flex justify-between border-b pb-2">
                  <span className="text-xs font-bold text-teal-600">OT 單字卡</span>
                  <button onClick={() => setActiveVocabModal(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div>
                  <h3 className="text-xl font-bold font-mono">{activeVocabModal.word}</h3>
                  <p className="text-xs text-slate-400">{activeVocabModal.phonetic}</p>
                </div>
                <p className="text-sm text-slate-700 bg-slate-50 p-3 rounded-xl">{activeVocabModal.definition}</p>
                <div className="flex justify-end">
                  <button onClick={() => speakText(activeVocabModal.word)} className="px-4 py-2 bg-teal-600 text-white text-xs font-bold rounded-xl flex items-center space-x-1">
                    <Volume2 className="w-3.5 h-3.5" />
                    <span>發音</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
